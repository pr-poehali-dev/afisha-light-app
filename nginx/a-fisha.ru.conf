server {
    listen 80;
    server_name ~^(?<group_id>\d+)\.a-fisha\.ru$;

    # Редирект на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ~^(?<group_id>\d+)\.a-fisha\.ru$;

    ssl_certificate     /etc/letsencrypt/live/a-fisha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a-fisha.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://functions.poehali.dev/27dbad0f-437f-4070-baa3-06f68e1505f6?group_id=$group_id;
        proxy_ssl_server_name on;
        proxy_set_header Host functions.poehali.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-Host $host;
        proxy_read_timeout 30s;
    }
}
